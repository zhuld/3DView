<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="3D viewer with head-motion parallax and pinch-gesture rotation, powered by MediaPipe and three.js."
    />
    <title>3DView 路 澶村姩瑙嗗樊 路 鎵嬪娍鏃嬭浆</title>
    <script>
      // 鍦ㄦ牱寮忕敓鏁堝墠纭畾涓婚锛岄伩鍏嶉灞忓湪娣辫壊 / 娴呰壊涔嬮棿闂儊銆?
      // 涓?src/ui/theme.ts 鍏辩敤鍚屼竴涓瓨鍌ㄩ敭涓庤В鏋愯鍒欍€?
      (() => {
        try {
          const stored = localStorage.getItem('3dview.theme');
          const preference = stored === 'dark' || stored === 'light' ? stored : 'auto';
          const dark =
            preference === 'dark' ||
            (preference === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <header id="statusbar">
      <div class="brand">
        <span class="dot" id="live-dot"></span>
        <strong>3DView</strong>
      </div>
      <div class="chips">
        <span class="chip" id="chip-fps">-- FPS</span>
        <span class="chip" id="chip-face" data-state="off" data-i18n="chip.face">闈㈤儴</span>
        <span class="chip" id="chip-hand" data-state="off" data-i18n="chip.hand">鎵嬮儴</span>
        <span class="chip" id="chip-backend">--</span>
      </div>
      <span id="tracking-status" class="sr-only" role="status" aria-live="polite"></span>
    </header>

    <div id="toast" hidden>
      <span id="toast-text" role="status" aria-live="polite"></span>
      <button type="button" id="toast-close" class="toast-close" aria-label="鍏抽棴鎻愮ず" data-i18n-aria-label="toast.close">脳</button>
    </div>

    <aside id="panel">
      <button id="panel-toggle" class="panel-toggle" aria-expanded="true" aria-label="鏀惰捣璁剧疆闈㈡澘">
        <span></span><span></span><span></span>
      </button>
      <div class="panel-body">
        <section>
          <h2 data-i18n="panel.parallax">澶村姩瑙嗗樊</h2>
          <label class="row switch">
            <input type="checkbox" id="opt-parallax" checked />
            <span data-i18n="panel.parallax.enable">鍚敤</span>
          </label>
          <label class="row">
            <span data-i18n="panel.parallax.gain">瑙嗗樊寮哄害</span>
            <input type="range" id="opt-gain" min="0" max="2.5" step="0.05" value="1" />
            <output id="out-gain">1.00</output>
          </label>
          <label class="row">
            <span data-i18n="panel.parallax.distance">瑙傜湅璺濈</span>
            <input type="range" id="opt-distance" min="1.4" max="4" step="0.05" value="2.4" />
            <output id="out-distance">2.40</output>
          </label>
          <button class="btn" id="btn-calibrate" data-i18n="panel.parallax.calibrate">閲嶆柊鏍″噯</button>
        </section>

        <section>
          <h2 data-i18n="panel.gesture">鎵嬪娍</h2>
          <label class="row switch">
            <input type="checkbox" id="opt-gesture" checked />
            <span data-i18n="panel.gesture.enable">鎹忓悎鎷栨嫿鏃嬭浆</span>
          </label>
          <label class="row">
            <span data-i18n="panel.gesture.sensitivity">鐏垫晱搴?/span>
            <input type="range" id="opt-sensitivity" min="0.2" max="2" step="0.05" value="1" />
            <output id="out-sensitivity">1.00</output>
          </label>
          <label class="row switch">
            <input type="checkbox" id="opt-landmarks" checked />
            <span data-i18n="panel.gesture.landmarks">鏄剧ず鍏抽敭鐐?/span>
          </label>
        </section>

        <section>
          <h2 data-i18n="panel.model">妯″瀷</h2>
          <label class="row">
            <span data-i18n="panel.model.preset">鍐呯疆</span>
            <select id="opt-preset">
              <option value="torusKnot" data-i18n="model.torusKnot">鐜潰绾界粨</option>
              <option value="helix" data-i18n="model.helix">铻烘棆寮圭哀</option>
              <option value="knot" data-i18n="model.knot">澶嶆潅绾界粨</option>
              <option value="superformula" data-i18n="model.superformula">瓒呭叕寮忔洸闈?/option>
            </select>
          </label>
          <button class="btn" id="btn-open" data-i18n="panel.model.open">鎵撳紑鏈湴鏂囦欢鈥?/button>
          <input type="file" id="file-input" accept=".glb,.gltf,.obj" hidden />
          <label class="row switch">
            <input type="checkbox" id="opt-autorotate" />
            <span data-i18n="panel.model.autorotate">鑷姩鏃嬭浆</span>
          </label>
          <button class="btn" id="btn-reset" data-i18n="panel.model.reset">閲嶇疆瑙嗚</button>
        </section>

        <section>
          <h2 data-i18n="panel.display">鏄剧ず</h2>
          <label class="row switch">
            <input type="checkbox" id="opt-ground" checked />
            <span data-i18n="panel.display.ground">鏄剧ず鍦伴潰</span>
          </label>
          <label class="row switch">
            <input type="checkbox" id="opt-background" checked />
            <span data-i18n="panel.display.background">鏄剧ず鑳屾櫙</span>
          </label>
        </section>

        <section>
          <h2 data-i18n="panel.system">绯荤粺</h2>
          <label class="row switch">
            <input type="checkbox" id="opt-camera" checked />
            <span data-i18n="panel.system.camera">浣跨敤鎽勫儚澶?/span>
          </label>
          <label class="row">
            <span data-i18n="panel.system.theme">涓婚</span>
            <select id="opt-theme">
              <option value="auto" data-i18n="theme.auto">璺熼殢绯荤粺</option>
              <option value="dark" data-i18n="theme.dark">娣辫壊</option>
              <option value="light" data-i18n="theme.light">娴呰壊</option>
            </select>
          </label>
          <label class="row">
            <span data-i18n="panel.system.language">璇█</span>
            <select id="opt-language">
              <option value="zh">涓枃</option>
              <option value="en">English</option>
            </select>
          </label>
        </section>
      </div>
    </aside>

    <div id="preview-card" hidden>
      <div id="preview-video"></div>
      <canvas id="preview-canvas" width="240" height="180"></canvas>
      <div class="hint" data-i18n="preview.hint">鎹忓悎鎷囨寚涓庨鎸囧苟鎷栧姩鍗冲彲鏃嬭浆</div>
    </div>

    <div id="drop-hint" hidden>
      <span data-i18n="drop.hint">鏉惧紑浠ヨ浇鍏ユā鍨?(.glb / .gltf / .obj)</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
